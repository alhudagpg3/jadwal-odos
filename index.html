<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jadwal ODOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Jadwal ODOS</h1>
  <nav>
    <button data-tab="jadwal" class="tab active">Jadwal</button>
    <button data-tab="ringkasan" class="tab">Ringkasan</button>
    <button data-tab="atur" class="tab">Pengaturan</button>
  </nav>
</header>

<main>
  <section id="atur" class="panel">
    <h2>Pengaturan peserta</h2>
    <label>Jumlah peserta
      <select id="jumlah">
        <option value="8">8 orang</option>
        <option value="10">10 orang</option>
      </select>
    </label>
    <label>Tanggal mulai Periode 1
      <input type="date" id="mulai">
    </label>
    <div id="namaBox"></div>
    <button id="simpan" class="primary">Simpan &amp; lihat jadwal</button>
    <p class="hint">Satu juz dibagi sesuai jumlah peserta dan bergeser satu bagian setiap periode (30 hari). Setelah 8 atau 10 periode, tiap orang sudah membaca seluruh bagian (1 khatam).</p>
    <button id="reset" class="danger">Hapus semua data</button>
  </section>

  <section id="jadwal" class="panel hidden">
    <div class="bar">
      <label>Periode
        <select id="periode"></select>
      </label>
      <span id="rentang" class="hint"></span>
    </div>
    <div class="wrap"><table id="tabel"></table></div>
    <div class="bar">
      <button id="hariIni">Ke hari ini</button>
      <button id="csv">Ekspor Excel (CSV)</button>
      <button id="pdf">Cetak / PDF</button>
    </div>
    <p class="hint">Ketuk sebuah bagian untuk menandai sudah dibaca.</p>
  </section>

  <section id="ringkasan" class="panel hidden">
    <h2>Progres periode ini</h2>
    <div id="prog"></div>
  </section>
</main>

// ---------- tab ----------
function show(tab){
  ['atur','jadwal','ringkasan'].forEach(function(t){$(t).classList.toggle('hidden',t!==tab)});
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});
  if(tab==='jadwal')renderJadwal();
  if(tab==='ringkasan')renderRingkasan();
}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){
  if(!state&&b.dataset.tab!=='atur'){alert('Isi pengaturan peserta dulu.');return}
  show(b.dataset.tab)}});

// ---------- pengaturan ----------
function namaInputs(n,names){
  var box=$('namaBox');box.innerHTML='';
  for(var i=0;i<n;i++){
    var row=document.createElement('div');row.className='namaRow';
    var lab=document.createElement('span');lab.textContent=String.fromCharCode(65+i);
    var inp=document.createElement('input');inp.type='text';inp.placeholder='Nama peserta '+(i+1);
    inp.value=(names&&names[i])||'';inp.dataset.i=i;
    row.appendChild(lab);row.appendChild(inp);box.appendChild(row);
  }
}
$('jumlah').onchange=function(){
  var cur=[].map.call($('namaBox').querySelectorAll('input'),function(x){return x.value});
  namaInputs(+$('jumlah').value,cur);
};
$('simpan').onclick=function(){
  var n=+$('jumlah').value;
  var names=[].map.call($('namaBox').querySelectorAll('input'),function(x,i){return x.value.trim()||String.fromCharCode(65+i)}).slice(0,n);
  if(!$('mulai').value){alert('Isi tanggal mulai.');return}
  var old=state&&state.n===n?state.done:{};
  state={n:n,names:names,start:$('mulai').value,done:old||{},periode:1};
  save();show('jadwal');
};
$('reset').onclick=function(){
  if(confirm('Hapus semua nama dan tanda baca?')){localStorage.removeItem(KEY);state=null;init()}
};

// ---------- jadwal ----------
function bagianUntuk(orang,p,juz){ // orang 0..n-1, p 1..n
  var n=state.n,part=(orang+p-1)%n;
  return window.ODOS_DATA[String(n)][String(juz)][part];
}
function startP(p){return addDays(parse(state.start),30*(p-1))}
function periodeAktif(){
  var t=new Date(),s=parse(state.start);
  var diff=Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate())-s)/86400000);
  var p=Math.floor(diff/30)+1;
  return Math.min(Math.max(p,1),state.n);
}
function renderJadwal(){
  var sel=$('periode');
  if(!sel.options.length||sel.options.length!==state.n){
    sel.innerHTML='';
    for(var p=1;p<=state.n;p++){var o=document.createElement('option');o.value=p;o.textContent='Periode '+p;sel.appendChild(o)}
    sel.value=state.periode||periodeAktif();
  }
  var p=+sel.value;state.periode=p;save();
  var s=startP(p),e=addDays(s,29);
  $('rentang').textContent=fmt(s)+' - '+fmt(e);
  var h='<tr><th class="sticky">Tgl</th><th>Juz</th>';
  state.names.forEach(function(nm,i){h+='<th>'+String.fromCharCode(65+i)+'<br>'+esc(nm)+'</th>'});
  h+='</tr>';
  var today=iso(new Date());
  for(var d=1;d<=30;d++){
    var dt=addDays(s,d-1);
    h+='<tr id="r'+d+'"'+(iso(dt)===today?' class="today"':'')+'><td class="sticky">'+fmtS(dt)+'</td><td>'+d+'</td>';
    for(var k=0;k<state.n;k++){
      var key=p+'|'+d+'|'+k;
      h+='<td class="bagian'+(state.done[key]?' done':'')+'" data-k="'+key+'">'+esc(bagianUntuk(k,p,d))+'</td>';
    }
    h+='</tr>';
  }
  $('tabel').innerHTML=h;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
$('periode').onchange=renderJadwal;
$('tabel').onclick=function(ev){
  var td=ev.target.closest('td.bagian');if(!td)return;
  var k=td.dataset.k;
  if(state.done[k])delete state.done[k];else state.done[k]=1;
  save();td.classList.toggle('done');
};
$('hariIni').onclick=function(){
  var p=periodeAktif();$('periode').value=p;renderJadwal();
  var r=document.querySelector('tr.today');
  if(r)r.scrollIntoView({block:'center'});else alert('Hari ini di luar rentang periode ini.');
};

// ---------- ringkasan ----------
function renderRingkasan(){
  var p=state.periode||1,h='<p class="hint">Periode '+p+': '+fmt(startP(p))+' - '+fmt(addDays(startP(p),29))+'</p>';
  state.names.forEach(function(nm,k){
    var c=0;for(var d=1;d<=30;d++)if(state.done[p+'|'+d+'|'+k])c++;
    h+='<div class="p"><b>'+String.fromCharCode(65+k)+'. '+esc(nm)+'</b> - '+c+' / 30 hari'
      +'<div class="bar2"><i style="width:'+(c/30*100)+'%"></i></div></div>';
  });
  $('prog').innerHTML=h;
}

// ---------- ekspor ----------
$('csv').onclick=function(){
  var p=state.periode,s=startP(p),rows=[];
  rows.push(['Tgl','Juz'].concat(state.names.map(function(n,i){return String.fromCharCode(65+i)+' - '+n})));
  for(var d=1;d<=30;d++){
    var r=[fmtS(addDays(s,d-1)),d];
    for(var k=0;k<state.n;k++)r.push(bagianUntuk(k,p,d)+(state.done[p+'|'+d+'|'+k]?' [selesai]':''));
    rows.push(r);
  }
  var csv='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='Jadwal_ODOS_Periode_'+p+'.csv';document.body.appendChild(a);a.click();a.remove();
};
$('pdf').onclick=function(){window.print()};

// ---------- mulai ----------
function init(){
  var n=state?state.n:8;
  $('jumlah').value=n;
  $('mulai').value=state?state.start:iso(new Date());
  namaInputs(n,state&&state.names);
  if(state){$('periode').innerHTML='';show('jadwal')}else show('atur');
}
init();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();

</script>
</body>
</html>
