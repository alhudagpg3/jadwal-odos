<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-v2-192.png">
<link rel="apple-touch-icon" href="icon-v2-192.png">
<title>Jadwal ODOS</title>
<link rel="stylesheet" href="style.css">
<style>
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:20px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btnHome{background:#ffffff33;color:#fff;border:0;padding:8px 12px}
.sub{padding:6px 12px 0;background:var(--biru)}
.card{background:#fff;border:1px solid #ccc;border-radius:8px;padding:12px;margin:10px 0}
.card.klik{cursor:pointer}
.card b{font-size:17px}
.muted{color:#666;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1}
.code{font-size:26px;font-weight:700;letter-spacing:4px;color:var(--biru)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:20;max-width:90%;display:none}
.badge{display:inline-block;background:var(--kuning);border:1px solid #e0c35f;border-radius:10px;padding:1px 8px;font-size:12px;margin-left:6px}
th.me{background:#c55a11}
td.me{box-shadow:inset 0 0 0 2px #c55a11}
td.bagian.lock{cursor:default}
.warn{background:#fdecea;border:1px solid #e5a5a0;border-radius:6px;padding:8px;font-size:14px}
.err{color:#b00;font-size:14px;margin:6px 0}
.loading{opacity:.6;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1 id="judul">Jadwal ODOS</h1>
  <button id="btnHome" class="hidden">Grup saya</button>
</header>

<main>
  <!-- BERANDA -->
  <section id="vHome" class="panel hidden">
    <h2>Grup saya</h2>
    <div id="daftarGrup"></div>
    <div class="row">
      <button id="goGabung" class="primary">Gabung grup</button>
      <button id="goBuat" class="primary">Buat grup baru</button>
    </div>
    <p class="hint">Gabung memakai kode 6 huruf dari admin grup. Setiap grup punya jadwal dan progres sendiri.</p>
  </section>

  <!-- BUAT GRUP -->
  <section id="vBuat" class="panel hidden">
    <h2>Buat grup baru</h2>
    <label>Nama grup<input type="text" id="bNama" maxlength="60" placeholder="contoh: ODOS Kantor Group 1"></label>
    <label>Jumlah peserta
      <select id="bJumlah"><option value="8">8 orang</option><option value="10">10 orang</option></select>
    </label>
    <label>Tanggal mulai Periode 1<input type="date" id="bMulai"></label>
    <div id="bNamaBox"></div>
    <label>PIN admin (minimal 4 karakter, untuk mengubah grup)<input type="password" id="bPin" autocomplete="new-password"></label>
    <div id="bErr" class="err"></div>
    <button id="bSimpan" class="primary">Buat grup</button>
    <button id="bBatal">Batal</button>
  </section>

  <!-- GABUNG -->
  <section id="vGabung" class="panel hidden">
    <h2>Gabung grup</h2>
    <label>Kode grup<input type="text" id="gKode" maxlength="10" placeholder="6 huruf/angka" autocapitalize="characters"></label>
    <button id="gCari" class="primary">Cari grup</button>
    <div id="gHasil"></div>
    <div id="gErr" class="err"></div>
    <button id="gBatal">Batal</button>
  </section>

  <!-- GRUP -->
  <section id="vGrup" class="panel hidden">
    <nav style="margin-bottom:8px">
      <button data-gt="jadwal" class="tab gt active" style="background:#ddd;color:#333">Jadwal</button>
      <button data-gt="ringkasan" class="tab gt" style="background:#ddd;color:#333">Ringkasan</button>
      <button data-gt="info" class="tab gt" style="background:#ddd;color:#333">Grup</button>
    </nav>

    <div id="gtJadwal">
      <div class="bar">
        <label>Periode<select id="periode"></select></label>
        <button id="hariIni" class="primary" style="width:auto;margin:0">Ke hari ini</button>
        <button id="btnRefresh">Muat ulang</button>
      </div>
      <div id="rentang" class="hint" style="margin:2px 0 6px"></div>
      <div class="wrap"><table id="tabel"></table></div>
      <div class="bar">
        <button id="csv">Ekspor Excel (CSV)</button>
        <button id="pdf">Cetak / PDF</button>
      </div>
      <p class="hint" id="hintJadwal"></p>
    </div>

    <div id="gtRingkasan" class="hidden">
      <div id="prog"></div>
    </div>

    <div id="gtInfo" class="hidden">
      <div class="card">
        <div class="muted">Kode grup</div>
        <div class="code" id="iKode"></div>
        <div class="row" style="margin-top:8px">
          <button id="iSalin">Salin tautan</button>
          <button id="iWA">Bagikan ke WhatsApp</button>
        </div>
      </div>
      <div class="card">
        <b>Saya adalah</b>
        <select id="iSaya"></select>
        <p class="hint">Hanya kolom Anda yang bisa dicentang. Admin bisa mencentang semua kolom.</p>
      </div>
      <div class="card" id="iAdminBox"></div>
      <div class="card">
        <button id="iKeluar" class="danger" style="margin:0">Keluar dari grup (di HP ini)</button>
      </div>
    </div>
  </section>
</main>
<div id="toast" class="toast"></div>

<script>
(function(){
'use strict';
// ====== PENGATURAN: tempel URL Web App Apps Script di sini ======
var API_URL='https://script.google.com/macros/s/AKfycbwMJ-CFn7IjeL2tWdAsjykqE9fUiMW-x0LElSrxG1FrRj8ZbnpmnecOxSsrXoN8yOPH/exec';
// ================================================================
var KEY='odos-pwa-v2';
var $=function(id){return document.getElementById(id)};
var BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var L=load();           // {groups:[{kode,nama,saya,admin,pin,periode}], cache:{kode:data}}
var cur=null;           // grup aktif (objek lokal)
var data=null;          // data server grup aktif
var done={};            // peta key->true
var timer=null;

function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.groups)return s}catch(e){}
  return {groups:[],cache:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(L))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));if(m)return new Date(+m[1],+m[2]-1,+m[3]);var d=new Date(s);return isNaN(d.getTime())?new Date():d}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function fmt(d){return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()}
function fmtS(d){return d.getDate()+'-'+BLN[d.getMonth()]}
function huruf(i){return String(i+1)}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2600)}
function grupLokal(kode){for(var i=0;i<L.groups.length;i++)if(L.groups[i].kode===kode)return L.groups[i];return null}

// ---------- API ----------
function api(action,payload){
  if(!API_URL||API_URL.indexOf('GANTI_')===0)return Promise.reject(new Error('URL Web App belum diisi di index.html (lihat PANDUAN.md).'));
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},payload||{}))})
    .then(function(r){return r.json()})
    .then(function(j){if(!j.ok)throw new Error(j.error||'Terjadi kesalahan');return j.data},
          function(){throw new Error('Tidak bisa terhubung. Periksa internet Anda.')});
}

// ---------- tampilan ----------
var VIEWS=['vHome','vBuat','vGabung','vGrup'];
function view(v){
  VIEWS.forEach(function(x){$(x).classList.toggle('hidden',x!==v)});
  $('btnHome').classList.toggle('hidden',v==='vHome');
  if(v!=='vGrup'){cur=null;data=null;clearInterval(timer);timer=null;$('judul').textContent='Jadwal ODOS'}
  window.scrollTo(0,0);
}
$('btnHome').onclick=home;
function home(){renderHome();view('vHome')}

// ---------- beranda ----------
function renderHome(){
  var h='';
  if(!L.groups.length)h='<div class="card muted">Belum ada grup. Buat grup baru atau gabung dengan kode dari admin.</div>';
  L.groups.forEach(function(g){
    var c=L.cache[g.kode];
    var saya=(g.saya!=null&&c&&c.names[g.saya])?('Saya: '+esc(c.names[g.saya])):'Belum pilih nama';
    h+='<div class="card klik" data-k="'+g.kode+'"><b>'+esc(g.nama)+'</b>'+(g.admin?'<span class="badge">admin</span>':'')
      +'<div class="muted">Kode '+g.kode+(c?' | '+c.n+' peserta':'')+' | '+saya+'</div></div>';
  });
  $('daftarGrup').innerHTML=h;
}
$('daftarGrup').onclick=function(e){var c=e.target.closest('.card.klik');if(c)bukaGrup(c.dataset.k)};
$('goBuat').onclick=function(){
  $('bNama').value='';$('bPin').value='';$('bErr').textContent='';$('bJumlah').value='8';
  $('bMulai').value=iso(new Date());bNama(8,[]);view('vBuat');
};
$('goGabung').onclick=function(){$('gKode').value='';$('gHasil').innerHTML='';$('gErr').textContent='';view('vGabung')};
$('bBatal').onclick=home;$('gBatal').onclick=home;

// ---------- buat grup ----------
function namaInputs(box,n,names,prefix){
  var h='';
  for(var i=0;i<n;i++)h+='<div class="namaRow" style="margin:4px 0"><span>'+huruf(i)+'</span><input type="text" maxlength="40" data-i="'+i+'" placeholder="Nama peserta '+(i+1)+'" value="'+esc((names&&names[i])||'')+'"></div>';
  box.innerHTML=h;
}
function bNama(n,names){namaInputs($('bNamaBox'),n,names)}
function bacaNama(box){return [].map.call(box.querySelectorAll('input'),function(x){return x.value.trim()})}
$('bJumlah').onchange=function(){bNama(+$('bJumlah').value,bacaNama($('bNamaBox')))};
$('bSimpan').onclick=function(){
  var nama=$('bNama').value.trim(),n=+$('bJumlah').value,mulai=$('bMulai').value,pin=$('bPin').value;
  $('bErr').textContent='';
  if(!nama){$('bErr').textContent='Nama grup wajib diisi.';return}
  if(!mulai){$('bErr').textContent='Isi tanggal mulai.';return}
  if(pin.length<4){$('bErr').textContent='PIN admin minimal 4 karakter.';return}
  $('vBuat').classList.add('loading');
  api('createGroup',{nama:nama,n:n,mulai:mulai,names:bacaNama($('bNamaBox')),pin:pin}).then(function(r){
    L.groups.push({kode:r.kode,nama:nama,saya:null,admin:true,pin:pin,periode:null});save();
    $('vBuat').classList.remove('loading');
    bukaGrup(r.kode,'info');
  }).catch(function(e){$('vBuat').classList.remove('loading');$('bErr').textContent=e.message});
};

// ---------- gabung ----------
$('gCari').onclick=function(){cariGrup($('gKode').value)};
function cariGrup(kode){
  kode=kode.toUpperCase().replace(/[^A-Z0-9]/g,'');
  $('gErr').textContent='';$('gHasil').innerHTML='';
  if(!kode){$('gErr').textContent='Isi kode grup.';return}
  $('vGabung').classList.add('loading');
  api('getGroup',{kode:kode}).then(function(g){
    $('vGabung').classList.remove('loading');
    L.cache[g.kode]=g;
    var h='<div class="card"><b>'+esc(g.nama)+'</b><div class="muted">'+g.n+' peserta</div><p>Pilih nama Anda:</p>';
    g.names.forEach(function(nm,i){h+='<button class="pil" data-i="'+i+'" style="display:block;width:100%;margin:4px 0;text-align:left">'+huruf(i)+'. '+esc(nm)+'</button>'});
    h+='<button class="pil" data-i="-1" style="display:block;width:100%;margin:8px 0 0;text-align:left">Hanya melihat (bukan peserta)</button></div>';
    $('gHasil').innerHTML=h;
    $('gHasil').onclick=function(e){
      var b=e.target.closest('.pil');if(!b)return;
      var i=+b.dataset.i;
      if(!grupLokal(g.kode))L.groups.push({kode:g.kode,nama:g.nama,saya:i<0?null:i,admin:false,pin:null,periode:null});
      else grupLokal(g.kode).saya=i<0?null:i;
      save();bukaGrup(g.kode);
    };
  }).catch(function(e){$('vGabung').classList.remove('loading');$('gErr').textContent=e.message});
}

// ---------- grup ----------
var gtab='jadwal';
document.querySelectorAll('.gt').forEach(function(b){b.onclick=function(){tabGrup(b.dataset.gt)}});
function tabGrup(t){
  gtab=t;
  document.querySelectorAll('.gt').forEach(function(b){var a=b.dataset.gt===t;b.classList.toggle('active',a);b.style.background=a?'var(--biru)':'#ddd';b.style.color=a?'#fff':'#333'});
  $('gtJadwal').classList.toggle('hidden',t!=='jadwal');
  $('gtRingkasan').classList.toggle('hidden',t!=='ringkasan');
  $('gtInfo').classList.toggle('hidden',t!=='info');
  if(t==='jadwal')renderJadwal();if(t==='ringkasan')renderRingkasan();if(t==='info')renderInfo();
}
function bukaGrup(kode,tab){
  cur=grupLokal(kode);if(!cur){home();return}
  data=L.cache[kode]||null;
  done={};if(data)data.done.forEach(function(k){done[k]=1});
  view('vGrup');$('judul').textContent=cur.nama;
  $('periode').innerHTML='';$('periode').dataset.key='';
  if(data)tabGrup(tab||'jadwal');else{tabGrup(tab||'jadwal');$('tabel').innerHTML='<tr><td>Memuat...</td></tr>'}
  segarkan(true);
  clearInterval(timer);timer=setInterval(function(){if(!document.hidden&&cur&&$('vGrup')&&!$('vGrup').classList.contains('hidden'))segarkan(false)},45000);
}
function segarkan(tampilkanError){
  var kode=cur&&cur.kode;if(!kode)return Promise.resolve();
  return api('getGroup',{kode:kode}).then(function(g){
    if(!cur||cur.kode!==kode)return;
    data=g;L.cache[kode]=g;cur.nama=g.nama;save();
    done={};g.done.forEach(function(k){done[k]=1});
    $('judul').textContent=g.nama;
    if(gtab==='jadwal')renderJadwal();else if(gtab==='ringkasan')renderRingkasan();else renderInfo();
  }).catch(function(e){
    if(e.message==='Grup tidak ditemukan'){
      if(confirm('Grup ini sudah dihapus admin. Hapus dari daftar di HP ini?')){L.groups=L.groups.filter(function(g){return g.kode!==kode});delete L.cache[kode];save();home()}
    }else if(tampilkanError)toast(data?'Offline - menampilkan data terakhir':e.message);
  });
}
$('btnRefresh').onclick=function(){segarkan(true).then(function(){toast('Diperbarui')})};

// jadwal
// Periode berurutan tanpa batas (siklus berulang): nomor periode = ((i-1) mod n)+1, siklus = floor((i-1)/n)+1.
// Rentang mengikuti bulan kalender: 30 hari per periode, tanggal 31 libur (tidak dijadwalkan).
// Bulan pendek (Februari) mulai sehari lebih awal (31 Jan - 1 Mar / 31 Jan - 29 Feb), bulan berikutnya mulai setelah periode sebelumnya berakhir.
var rangeMemo={key:'',list:[null]};
function periodRange(i){
  if(rangeMemo.key!==data.mulai){rangeMemo={key:data.mulai,list:[null]}}
  var L2=rangeMemo.list,base=parse(data.mulai);
  while(L2.length<=i){
    var j=L2.length,s,prevEnd=j>1?L2[j-1].e:null;
    var m=new Date(base.getFullYear(),base.getMonth()+j-1,1);
    if(j===1){s=base}
    else{
      var len=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
      s=len<30?addDays(m,-1):m;
      if(s<=prevEnd)s=addDays(prevEnd,1);
    }
    L2.push({s:s,e:addDays(s,29),bulan:BLN[m.getMonth()]+' '+m.getFullYear()});
  }
  return L2[i];
}
function startP(p){return periodRange(p).s}
function endP(p){return periodRange(p).e}
function nomorP(i){return ((i-1)%data.n)+1}
function siklusP(i){return Math.floor((i-1)/data.n)+1}
function periodeAktif(){ // nomor periode berurutan yang memuat hari ini (atau yang terakhir dimulai)
  var t=new Date(),today=new Date(t.getFullYear(),t.getMonth(),t.getDate()),i=1;
  while(startP(i+1)<=today&&i<data.n*data.n)i++;
  return i;
}
function bagian(k,p,d){return window.ODOS_DATA[String(data.n)][String(d)][(k+p-1)%data.n]}
function bolehCentang(k){return cur.admin||(cur.saya!=null&&cur.saya===k)}
function isiPilihanPeriode(sel,aktif){
  var maks=data.n*data.n,h='',sk=0;
  for(var i=1;i<=maks;i++){
    if(siklusP(i)!==sk){if(sk)h+='</optgroup>';sk=siklusP(i);h+='<optgroup label="Siklus '+sk+' dari '+data.n+' (Khatam ke-'+sk+')">'}
    h+='<option value="'+i+'">Periode '+nomorP(i)+' - '+periodRange(i).bulan+'</option>';
  }
  sel.innerHTML=h+'</optgroup>';
}
function renderJadwal(){
  if(!data)return;
  var sel=$('periode');
  if(!sel.dataset.key||sel.dataset.key!==data.mulai+'|'+data.n){
    isiPilihanPeriode(sel,periodeAktif());sel.dataset.key=data.mulai+'|'+data.n;
    sel.value=(cur.periode&&cur.periode>=1&&cur.periode<=sel.options.length)?cur.periode:periodeAktif();
  }
  var p=+sel.value;cur.periode=p;save();
  $('rentang').textContent='Siklus '+siklusP(p)+' dari '+data.n+' (Khatam ke-'+siklusP(p)+') | '+fmt(startP(p))+' - '+fmt(endP(p))+' | tanggal 31 libur';
  var h='<tr><th class="sticky">Tgl</th><th>Juz</th>';
  data.names.forEach(function(nm,i){h+='<th'+(cur.saya===i?' class="me"':'')+'>'+huruf(i)+'<br>'+esc(nm)+'</th>'});
  h+='</tr>';
  var today=iso(new Date());
  for(var d=1;d<=30;d++){
    var dt=addDays(startP(p),d-1);
    h+='<tr id="r'+d+'"'+(iso(dt)===today?' class="today"':'')+'><td class="sticky">'+fmtS(dt)+'</td><td>'+d+'</td>';
    for(var k=0;k<data.n;k++){
      var key=p+'|'+d+'|'+k;
      h+='<td class="bagian'+(done[key]?' done':'')+(cur.saya===k?' me':'')+(bolehCentang(k)?'':' lock')+'" data-key="'+key+'" data-k="'+k+'">'+esc(bagian(k,p,d))+'</td>';
    }
    h+='</tr>';
  }
  $('tabel').innerHTML=h;
  $('hintJadwal').textContent=cur.saya!=null?'Ketuk bagian di kolom Anda (bertanda oranye) untuk menandai sudah dibaca. Tanggal 31 libur.':(cur.admin?'Sebagai admin Anda bisa mencentang semua kolom. Pilih nama Anda di tab Grup bila Anda juga peserta.':'Pilih nama Anda di tab Grup agar bisa mencentang.');
}
$('periode').onchange=renderJadwal;
$('tabel').onclick=function(ev){
  var td=ev.target.closest('td.bagian');if(!td)return;
  var k=+td.dataset.k,key=td.dataset.key;
  if(!bolehCentang(k)){toast(cur.saya==null?'Pilih nama Anda di tab Grup dulu.':'Anda hanya bisa mencentang kolom Anda sendiri.');return}
  var nilai=!done[key];
  if(nilai)done[key]=1;else delete done[key];
  td.classList.toggle('done',nilai);
  api('setDone',{kode:cur.kode,key:key,value:nilai}).then(function(){
    var arr=Object.keys(done);data.done=arr;L.cache[cur.kode]=data;save();
  }).catch(function(e){
    if(nilai)delete done[key];else done[key]=1;
    td.classList.toggle('done',!nilai);toast('Gagal menyimpan: '+e.message);
  });
};
$('hariIni').onclick=function(){
  var i=periodeAktif();$('periode').value=i;renderJadwal();
  var r=document.querySelector('tr.today');
  if(r){var w=document.querySelector('.wrap');window.scrollTo(0,0);w.scrollTop+=r.getBoundingClientRect().top-w.getBoundingClientRect().top-w.clientHeight/2+r.clientHeight/2;return}
  var t=new Date(),today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(today<startP(1))toast('Jadwal baru dimulai '+fmt(startP(1))+'.');
  else if(today>endP(i))toast('Hari ini tanggal '+today.getDate()+': libur, tidak ada bacaan.');
  else toast('Hari ini di luar rentang periode ini.');
};

// ringkasan
function renderRingkasan(){
  if(!data)return;
  var n=data.n,p=cur.periode||periodeAktif(),sk=siklusP(p),p0=(sk-1)*n+1,p1=sk*n;
  var h='<p class="hint">Periode '+nomorP(p)+' | Siklus '+sk+' dari '+n+' (Khatam ke-'+sk+'): '+fmt(startP(p))+' - '+fmt(endP(p))+'<br>Jadwal selesai: '+fmt(endP(n*n))+'</p>';
  data.names.forEach(function(nm,k){
    var c=0,tot=0,khatam=0;
    for(var d=1;d<=30;d++)if(done[p+'|'+d+'|'+k])c++;
    for(var s2=1;s2<=n;s2++){
      var t=0;for(var q=(s2-1)*n+1;q<=s2*n;q++)for(var e=1;e<=30;e++)if(done[q+'|'+e+'|'+k])t++;
      if(s2===sk)tot=t;if(t>=30*n)khatam++;
    }
    h+='<div class="card"><b>'+huruf(k)+'. '+esc(nm)+'</b>'+(cur.saya===k?'<span class="badge">saya</span>':'')
      +'<span class="badge">Khatam: '+khatam+' / '+n+'</span>'
      +'<div class="muted">Periode ini: '+c+' / 30 hari</div><div class="bar2"><i style="width:'+(c/30*100)+'%"></i></div>'
      +'<div class="muted" style="margin-top:6px">Siklus '+sk+' (menuju khatam ke-'+sk+'): '+tot+' / '+(30*n)+'</div><div class="bar2"><i style="width:'+(tot/(30*n)*100)+'%"></i></div></div>';
  });
  $('prog').innerHTML=h;
}

// info + admin
function tautan(){return location.origin+location.pathname+'?g='+cur.kode}
function renderInfo(){
  if(!data)return;
  $('iKode').textContent=cur.kode;
  var o='<option value="-1">(Bukan peserta / hanya melihat)</option>';
  data.names.forEach(function(nm,i){o+='<option value="'+i+'"'+(cur.saya===i?' selected':'')+'>'+huruf(i)+'. '+esc(nm)+'</option>'});
  $('iSaya').innerHTML=o;
  renderAdmin();
}
$('iSaya').onchange=function(){var v=+$('iSaya').value;cur.saya=v<0?null:v;save();toast('Disimpan')};
$('iSalin').onclick=function(){
  var t=tautan();
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Tautan disalin')},function(){prompt('Salin tautan:',t)});
  else prompt('Salin tautan:',t);
};
$('iWA').onclick=function(){
  var t='Gabung grup ODOS "'+cur.nama+'". Buka tautan ini lalu pilih nama Anda: '+tautan()+' (kode: '+cur.kode+')';
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
};
$('iKeluar').onclick=function(){
  if(!confirm('Keluar dari grup ini di HP ini? Data grup di server tidak dihapus.'))return;
  var kode=cur.kode;L.groups=L.groups.filter(function(g){return g.kode!==kode});save();home();
};
function renderAdmin(){
  var b=$('iAdminBox');
  if(!cur.admin){
    b.innerHTML='<b>Admin</b><p class="hint">Masukkan PIN admin untuk mengubah nama peserta, tanggal mulai, atau menghapus grup.</p>'
      +'<input type="password" id="aPin" placeholder="PIN admin" autocomplete="off"><div id="aErr" class="err"></div><button id="aMasuk" class="primary">Masuk sebagai admin</button>';
    $('aMasuk').onclick=function(){
      var pin=$('aPin').value;
      api('verifyPin',{kode:cur.kode,pin:pin}).then(function(){cur.admin=true;cur.pin=pin;save();toast('Mode admin aktif');renderInfo()})
        .catch(function(e){$('aErr').textContent=e.message});
    };
    return;
  }
  b.innerHTML='<b>Pengaturan admin</b>'
    +'<label>Nama grup<input type="text" id="eNama" maxlength="60" value="'+esc(data.nama)+'"></label>'
    +'<label>Jumlah peserta<select id="eJumlah"><option value="8">8 orang</option><option value="10">10 orang</option></select></label>'
    +'<div id="eWarn" class="warn hidden">Mengubah jumlah peserta menghapus seluruh progres (centang) grup ini dan membagi ulang bagian bacaan.</div>'
    +'<label>Tanggal mulai Periode 1<input type="date" id="eMulai" value="'+data.mulai+'"></label>'
    +'<div id="eNamaBox"></div><div id="eErr" class="err"></div>'
    +'<button id="eSimpan" class="primary">Simpan perubahan</button>'
    +'<button id="eHapus" class="danger">Hapus grup</button>';
  $('eJumlah').value=String(data.n);
  namaInputs($('eNamaBox'),data.n,data.names);
  $('eJumlah').onchange=function(){
    var n=+$('eJumlah').value;$('eWarn').classList.toggle('hidden',n===data.n);
    namaInputs($('eNamaBox'),n,bacaNama($('eNamaBox')));
  };
  $('eSimpan').onclick=function(){
    var n=+$('eJumlah').value;
    if(n!==data.n&&!confirm('Progres grup akan dihapus. Lanjutkan?'))return;
    api('updateGroup',{kode:cur.kode,pin:cur.pin,nama:$('eNama').value,n:n,mulai:$('eMulai').value,names:bacaNama($('eNamaBox'))}).then(function(g){
      data=g;L.cache[cur.kode]=g;cur.nama=g.nama;done={};g.done.forEach(function(k){done[k]=1});
      if(cur.saya!=null&&cur.saya>=g.n)cur.saya=null;
      cur.periode=null;$('periode').innerHTML='';$('periode').dataset.key='';save();$('judul').textContent=g.nama;toast('Perubahan disimpan');renderInfo();
    }).catch(function(e){$('eErr').textContent=e.message;if(/PIN/.test(e.message)){cur.admin=false;cur.pin=null;save()}});
  };
  $('eHapus').onclick=function(){
    if(!confirm('Hapus grup "'+data.nama+'" untuk SEMUA peserta? Tidak bisa dibatalkan.'))return;
    api('deleteGroup',{kode:cur.kode,pin:cur.pin}).then(function(){
      var kode=cur.kode;L.groups=L.groups.filter(function(g){return g.kode!==kode});delete L.cache[kode];save();toast('Grup dihapus');home();
    }).catch(function(e){$('eErr').textContent=e.message});
  };
}

// ekspor
$('csv').onclick=function(){
  var p=cur.periode,s=startP(p),rows=[];
  rows.push(['Tgl','Juz'].concat(data.names.map(function(n,i){return huruf(i)+' - '+n})));
  for(var d=1;d<=30;d++){
    var r=[fmtS(addDays(s,d-1)),d];
    for(var k=0;k<data.n;k++)r.push(bagian(k,p,d)+(done[p+'|'+d+'|'+k]?' [selesai]':''));
    rows.push(r);
  }
  var csv='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='Jadwal_ODOS_'+data.nama.replace(/[^\w]+/g,'_')+'_Periode_'+nomorP(p)+'_Siklus_'+siklusP(p)+'.csv';document.body.appendChild(a);a.click();a.remove();
};
$('pdf').onclick=function(){window.print()};

// ---------- mulai ----------
function init(){
  var kodeUrl=(new URLSearchParams(location.search).get('g')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  renderHome();
  if(kodeUrl){
    if(grupLokal(kodeUrl)){bukaGrup(kodeUrl);return}
    $('gKode').value=kodeUrl;$('gHasil').innerHTML='';$('gErr').textContent='';view('vGabung');cariGrup(kodeUrl);return;
  }
  if(L.groups.length===1)bukaGrup(L.groups[0].kode);else view('vHome');
}
init();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();

</script>
</body>
